name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      published-packages: ${{ steps.changesets.outputs.published-packages }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # Release writes (the Version Packages PR, tags and GitHub Releases) use
      # a GitHub App token instead of `GITHUB_TOKEN`. Events caused by
      # `GITHUB_TOKEN` don't trigger other workflows, so the server's Releases
      # would never start build-server.yml, and checks on the Version Packages
      # PR would wait for manual approval.
      #
      # Requires the laplace-release-bot GitHub App installed on this repo with
      # Contents and Pull requests read & write, its Client ID and private key
      # stored in the `RELEASE_APP_CLIENT_ID` and `RELEASE_APP_PRIVATE_KEY` org
      # secrets.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Release Pull Request or Tag Releases
        id: changesets
        uses: changesets/action@v2
        with:
          # Every package is private: `changeset publish` only tags the new
          # versions (`privatePackages.tag`), and the action pushes the tags
          # and creates a GitHub Release per tag from its CHANGELOG entry.
          publish-script: bun run release
          version-script: bun run version
          commit-message: "Version Packages [skip ci]"
          # The @laplace.live/kakashi-server Release fires build-server.yml's
          # `release: created` trigger, which builds, signs and uploads the
          # binaries. v2 reads the token only from this input, not from the
          # `GITHUB_TOKEN` env var.
          github-token: ${{ steps.app-token.outputs.token }}

  # Runs on this master push rather than on the tag, which the github-pages
  # environment's branch protection would reject.
  deploy-userscript:
    needs: release
    if: contains(fromJSON(needs.release.outputs.published-packages).*.name, 'laplace-chatterbox')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-userscript.yml
    secrets: inherit
